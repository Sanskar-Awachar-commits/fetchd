name: Build and Release fetchd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fetchd-linux
            binary_name: fetchd
          - os: macos-latest
            artifact_name: fetchd-macos
            binary_name: fetchd
          - os: windows-latest
            artifact_name: fetchd-windows.exe
            binary_name: fetchd.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --clean --name fetchd fetchd.py

      - name: Stage binary for upload (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/${{ matrix.binary_name }} ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Stage binary for upload (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item -Path "dist\${{ matrix.binary_name }}" -Destination "${{ matrix.artifact_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true